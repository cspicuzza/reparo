packages:
  - apps/*
  - packages/*

# pnpm 12 blocks dependency postinstall scripts (strictDepBuilds). Allow-list only
# what must build: esbuild's postinstall places its platform binary.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.44'
  - '@tanstack/router-core@1.171.37'
  - '@tanstack/router-generator@1.167.43'
  - '@tanstack/router-plugin@1.168.45'
