name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads the version from package.json#packageManager and
      # caches the store itself. actions/setup-node's `cache: pnpm` requires pnpm to
      # be pre-installed, so this must run first (https://github.com/pnpm/action-setup).
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # M0 follow-up (see Linear): start Supabase CLI here so packages/api
      # service tests run against a real Postgres in CI.
